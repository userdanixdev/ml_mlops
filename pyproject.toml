[project]
name = "ml-mlops"
version = "0.1.0"
description = "Pipeline e deploy para projeto de Mlops"
authors = [
    {name = "Daniel",email = "f.daniel.m@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy (>=2.5.4,<3.0.0)",
    "pandas (>=3.1.1,<4.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "mlflow (>=3.18.0,<4.0.0)",
    "fastapi (>=0.163.1,<0.164.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "pydantic (>=2.14.3,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.17.5,<0.18.0)"
]
[tool.poetry]
packages = [
    { include = "mlops", from = "src" }
]

