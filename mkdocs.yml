site_name: Project Pipeline MLops - Dataset Breast Cancer Wisconsin
site_description: Estudos de Machine Learning Operations

theme:
  name: material
  language: pt-BR

markdown_extensions:
  - attr_list
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
extra_css:
  - stylesheets/extra.css  

nav:
  - Início: index.md

  - 1. Preparação do Ambiente: environment.md
      
  - 2. Preparação e Análise dos Dados:
      - Visão geral: data_exploration.md
      - Exploração dos dados: dataset_overview.md
      - Pré-processamento: preprocessing_report.md

  - 3. Treinamento dos Modelos:
      - Baseline - Random Forest: random_forest.md
      - Baseline - Logistic Regression: logistic_regression.md
      - Avaliação dos modelos: model_evaluation.md

  - 4. Otimização:
      - Visão Geral da Otimização: hyperparameter_tuning.md
      - RandomizedSearchCV: randomized_search.md
      - Relatório RandomizedSearchCV: reports_randomized_search.md
      - HalvingGridSearchCV: hyperparameter_tuning_2.md
      - Relatório HalvingGridSearchCV: report_hyperparameter_tuning_2.md
      
  - 5. Registro do Modelo:
      - Model Registry: model_registry.md
      - MLflow Tracking: mlflow_tracking.md
      - MLflow Model Registry: mlflow_registry.md

  - 6. Monitoramento:
      - Data Drift: data_drift.md
      - Métricas de produção: production_metrics.md

  - 7. API de Inferência:
      - FastAPI: api.md
      - Endpoint de predição: prediction_endpoint.md

  - 8. Containerização:
      - Docker: docker.md

  - 9. Orquestração:
      - Kubernetes: kubernetes.md
      - Deployment e Service: deployment.md
      - Escalabilidade: scalability.md